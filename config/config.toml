[paths]
database = "data/database/app.db"
indexes = "data/indexes"
cache = "data/cache"
logs = "data/logs"
models = "models"

[indexing]
strict_hash_verification = true
hash_block_size = 1048576

[logging]
level = "INFO"
max_bytes = 2000000
backup_count = 3

[parsing]
pipeline_version = "phase2-v4"
pdf_min_text_characters = 40
pdf_min_alphanumeric_ratio = 0.20
remove_repeated_headers_footers = true
repeated_margin_lines = 2
repeated_page_ratio = 0.70

[ocr]
enabled = true
languages = ["tur", "eng"]
tesseract_command = ""
dpi = 300

[chunking]
chunk_size = 1200
overlap = 150

[embedding]
model_path = "models/embedding/bge-m3"
device = "cpu"
batch_size = 32
input_format = "raw"

[vector_index]
artifact = "semantic.faiss"
version = 1

[retrieval]
lexical_top_k = 30
semantic_top_k = 30
fused_top_k = 30
max_context_chunks = 8
rrf_k = 60
exact_phrase_boost = 0.005
acronym_boost = 0.005
minimum_evidence_threshold = 0.01
minimum_semantic_score = 0.50
translation_enabled = false

[generation]
temperature = 0.1
max_context_chunks = 8
max_output_tokens = 512
seed = 42
max_regeneration_attempts = 1
max_context_characters = 6000

[llm]
model_path = "models/llm/qwen3-8b/Qwen3-8B-Q4_K_M.gguf"
context_size = 4096
n_batch = 128
n_gpu_layers = 0
use_mmap = true
use_mlock = false
