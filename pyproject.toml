[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-document-intelligence"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pdfplumber>=0.11,<0.12",
    "pypdfium2>=4.30,<5",
    "python-docx>=1.1,<2",
    "pytesseract>=0.3.13,<0.4",
    "numpy>=1.26,<3",
    "sentence-transformers>=3,<6",
    "transformers>=4.41,<5",
    "faiss-cpu>=1.8,<2",
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
llm = ["llama-cpp-python>=0.3.35,<0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
